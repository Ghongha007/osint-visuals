<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ - disruption timeline</title>
<!-- Written by osint-visuals outage-timeline (outage.py). One self-contained page: the events,
     the country outlines and every label are embedded below. No network, no library, no key.
     Aggregate only: the page says where and when disruptions were reported, not who was cut off. -->
<style>
  :root { --bg:#0b0f13; --panel:#121820; --ink:#eef2f0; --dim:#9aa7b0; --line:#23303a; --accent:#4fd1c5;
          --shutdown:#f2a65a; --throttle:#4fd1c5; --jamming:#e06c75; --cable:#61afef; --cyber:#c678dd; --power:#e5c07b; --unknown:#7f8c8d;
          --sea:#0e1a22; --land:#26343f; --warm:#f2a65a; }
  [data-theme="light"] { --bg:#f6f3ec; --panel:#fffdf8; --ink:#1e2529; --dim:#63707a; --line:#ddd5c6;
          --sea:#e4ecee; --land:#dcd6c6; --accent:#0f766e;
          --shutdown:#b9770e; --throttle:#0f766e; --jamming:#b03a48; --cable:#2f6db3; --cyber:#7b4fa8; --power:#9a7b1f; --unknown:#6b777c; --warm:#b9770e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding:22px 22px 40px; }
  header { max-width:1600px; margin:0 auto 12px; }
  .kicker { font:800 11px/1 ui-monospace, monospace; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:12px auto; max-width:1600px;
         padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .bar .hint { color:var(--dim); font-size:12px; }
  .bar button { font:600 12px system-ui, sans-serif; color:var(--ink); background:var(--bg);
         border:1px solid var(--line); border-radius:7px; padding:7px 10px; cursor:pointer; }
  .bar button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .bar button:hover { border-color:var(--accent); }
  .bar .sp { flex:1; }
  main { max-width:1600px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; }
  #chart { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; overflow:auto; }
  #chart svg { display:block; width:100%; height:auto; }
  #side { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #side h2 { font-size:14px; margin:0 0 8px; }
  #side table { width:100%; border-collapse:collapse; font-size:12px; }
  #side td { padding:4px 6px; border-bottom:1px solid var(--line); }
  #side td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  #side .hint { color:var(--dim); font-size:11.5px; margin-top:10px; }
  #table { display:none; max-width:1600px; margin:12px auto 0; background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:12px; }
  #table h3 { margin:0 0 8px; font-size:13px; }
  table.big { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:14px; }
  table.big th, table.big td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  table.big th { color:var(--dim); }
  footer { max-width:1600px; margin:12px auto 0; color:var(--dim); font-size:11px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
</style></head>
<body>
<header>
  <div class="kicker">Disruption timeline / aggregate view</div>
  <h1 class="sr-only">__TITLE__</h1>
</header>

<div class="bar" id="filters"></div>

<main>
  <div id="chart"></div>
  <aside id="side"></aside>
</main>

<div id="table"></div>
<footer id="foot"></footer>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const W = 1600, PAD = 40, TOP = 120, LANE = 26, MAX_LANES = 16;
document.documentElement.dataset.theme = D.theme || "dark";
const activeCause = new Set(D.causes.map(c => c.key));
const activeScope = new Set(D.scopes.map(s => s.name));
const COLOURS = {shutdown:"var(--shutdown)", throttle:"var(--throttle)", jamming:"var(--jamming)", cable:"var(--cable)",
                 cyber:"var(--cyber)", power:"var(--power)", unknown:"var(--unknown)"};

const day = s => Date.parse(s + "T00:00:00Z");
const DAY = 86400000;
function monthOf(ms) { const d = new Date(ms); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); }
function num(n) { return Number(n).toLocaleString("en"); }
function causeLabel(k) { const c = D.causes.find(x => x.key === k); return c ? c.label : k; }

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("role", "img");
svg.setAttribute("aria-label", D.title);
function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

function current() {
  const evs = D.events.filter(e => activeCause.has(e.cause) && activeScope.has(e.scope || "Not stated"));
  const byC = {}, byLane = {}, byCause = {}, byTrigger = {}, byScope = {}, byM = {};
  let days = 0;
  for (const e of evs) {
    days += e.days;
    byC[e.c] = (byC[e.c] || 0) + e.days;
    byLane[e.lane] = (byLane[e.lane] || 0) + e.days;
    byCause[e.cause] = (byCause[e.cause] || 0) + e.days;
    if (e.trigger) byTrigger[e.trigger] = (byTrigger[e.trigger] || 0) + e.days;
    byScope[e.scope || "Not stated"] = (byScope[e.scope || "Not stated"] || 0) + e.days;
    const s = day(e.s), n = e.days;
    for (let i = 0; i < n; i++) { const m = monthOf(s + i * DAY); byM[m] = (byM[m] || 0) + 1; }
  }
  return {evs, byC, byLane, byCause, byTrigger, byScope, byM, days};
}

// ------------------------------------------------------------------ filters
(function filters() {
  const bar = $("filters");
  const hint = document.createElement("span"); hint.className = "hint";
  hint.textContent = `${D.total_events} events, ${D.total_days} event-days, ${D.countries.length} countries`;
  bar.append(hint);
  for (const c of D.causes) {
    const b = document.createElement("button");
    b.textContent = c.label; b.setAttribute("aria-pressed", "true");
    b.onclick = () => { activeCause.has(c.key) ? activeCause.delete(c.key) : activeCause.add(c.key); render(); };
    bar.append(b);
  }
  const sp = document.createElement("span"); sp.className = "sp"; bar.append(sp);
  const tb = document.createElement("button"); tb.textContent = "Table view";
  tb.onclick = () => { const t = $("table"); t.style.display = t.style.display === "block" ? "none" : "block"; };
  const png = document.createElement("button"); png.textContent = "PNG";
  const sv = document.createElement("button"); sv.textContent = "SVG";
  bar.append(tb, png, sv);
  png.onclick = () => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgString()], { type: "image/svg+xml" }));
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d");
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim() || "#121820";
      g.fillStyle = bg; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0);
      URL.revokeObjectURL(url); c.toBlob(b => save(b, "png"));
    };
    img.src = url;
  };
  sv.onclick = () => save(new Blob([svgString()], { type: "image/svg+xml" }), "svg");
})();

function slug() { return (D.title || "timeline").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48); }
function save(blob, ext) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function svgString() {
  const c = svg.cloneNode(true);
  c.setAttribute("xmlns", NS); c.setAttribute("width", W); c.setAttribute("height", H);
  return new XMLSerializer().serializeToString(c);
}

// ------------------------------------------------------------------ render
let H = 1000;
function render() {
  const S = current();
  const lanes = D.lanes.filter(c => S.byLane[c.name]).slice(0, MAX_LANES);
  H = TOP + lanes.length * LANE + 40 + 130 + 40 + 260 + 60;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "var(--panel)" });
  el("text", { x: PAD, y: 44, fill: "var(--ink)", "font-size": 26, "font-weight": 800, "font-family": "system-ui, sans-serif" }, svg, D.title);
  if (D.subtitle) el("text", { x: PAD, y: 68, fill: "var(--dim)", "font-size": 13 }, svg, D.subtitle);
  el("text", { x: PAD, y: 90, fill: "var(--dim)", "font-size": 11.5, "font-family": "ui-monospace, monospace" }, svg,
     `${num(S.evs.length)} events - ${num(S.days)} event-days` +
     (D.source ? ` - source: ${D.source}` : " - source not stated") + " - aggregate, no one named");

  // ---- Gantt
  const GX = 210, GW = W - PAD - GX;
  const t0 = day(D.range[0]), t1 = day(D.range[1]) + DAY;
  const x = t => GX + (t - t0) / (t1 - t0) * GW;
  const ganttH = lanes.length * LANE;
  el("text", { x: PAD, y: TOP - 10, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "Events over time");
  lanes.forEach((c, i) => {
    const y = TOP + i * LANE;
    el("rect", { x: GX, y, width: GW, height: LANE - 2, fill: i % 2 ? "var(--bg)" : "transparent", opacity: .5 });
    const label = c.name.length > 30 ? c.name.slice(0, 29) + "..." : c.name;
    const node = el("text", { x: GX - 8, y: y + 16, fill: "var(--ink)", "font-size": 11, "text-anchor": "end" }, svg, label);
    el("title", {}, node, c.name);
  });
  // month grid
  const months = [];
  { let d = new Date(t0); d.setUTCDate(1);
    while (d.getTime() < t1) { months.push(new Date(d)); d.setUTCMonth(d.getUTCMonth() + 1); } }
  const step = Math.max(1, Math.ceil(months.length / 12));
  months.forEach((m, i) => {
    const xm = x(m.getTime());
    el("line", { x1: xm, y1: TOP, x2: xm, y2: TOP + ganttH, stroke: "var(--line)", "stroke-width": .6 });
    if (i % step === 0) el("text", { x: xm + 3, y: TOP + ganttH + 14, fill: "var(--dim)", "font-size": 9.5,
      "font-family": "ui-monospace, monospace" }, svg, monthOf(m.getTime()));
  });
  // bars
  const laneIndex = new Map(lanes.map((c, i) => [c.name, i]));
  for (const e of S.evs) {
    const i = laneIndex.get(e.lane);
    if (i == null) continue;
    const x1 = x(day(e.s)), x2 = Math.max(x1 + 2, x(day(e.e) + DAY));
    const attrs = { x: x1, y: TOP + i * LANE + 4, width: x2 - x1, height: LANE - 10, rx: 3,
      fill: COLOURS[e.cause] || COLOURS.unknown, opacity: .85 };
    if (e.open === "ongoing" || e.open === "unknown") attrs["stroke-dasharray"] = "4 3";
    const node = el("rect", attrs);
    const openText = e.open === "ongoing" ? ", ongoing" : e.open === "unknown" ? ", end unknown" : "";
    const trig = e.trigger ? ` / ${e.trigger}` : "";
    el("title", {}, node, `${e.lane} ${e.s}${e.e !== e.s ? " to " + e.e : ""} - ${causeLabel(e.cause)}${trig} (${e.days} day${e.days === 1 ? "" : "s"}${openText})`);
  }

  // ---- density
  const dY = TOP + ganttH + 40;
  el("text", { x: PAD, y: dY, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "Event-days per month");
  const maxM = Math.max(1, ...Object.values(S.byM));
  const bw = (W - 2 * PAD) / Math.max(1, months.length);
  months.forEach((m, i) => {
    const key = monthOf(m.getTime()); const v = S.byM[key] || 0; const h = v / maxM * 110;
    const node = el("rect", { x: PAD + i * bw + 1, y: dY + 120 - h, width: Math.max(1, bw - 2), height: h,
      fill: "var(--accent)", opacity: .8 });
    el("title", {}, node, `${key}: ${v} event-days`);
  });
  el("line", { x1: PAD, y1: dY + 120, x2: W - PAD, y2: dY + 120, stroke: "var(--line)" });

  // ---- map
  const mY = dY + 170, mW = (W - 2 * PAD) * 0.55, mH = 250;
  el("text", { x: PAD, y: mY - 8, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "Where the events were reported");
  const view = D.view || [-180, -60, 180, 75];
  const mx = lon => PAD + (lon - view[0]) / (view[2] - view[0]) * mW;
  const my = lat => mY + (view[3] - lat) / (view[3] - view[1]) * mH;
  el("rect", { x: PAD, y: mY, width: mW, height: mH, fill: "var(--sea)", stroke: "var(--line)" });
  const defs = el("defs", {}); const clip = el("clipPath", { id: "mapclip" }, defs);
  el("rect", { x: PAD, y: mY, width: mW, height: mH }, clip);
  const g = el("g", { "clip-path": "url(#mapclip)" });
  const maxC = Math.max(1, ...Object.values(S.byC));
  (D.basemap || []).forEach(c => {
    const v = S.byC[c.name] || 0;
    const t = v ? 0.18 + 0.82 * Math.sqrt(v / maxC) : 0;
    c.polys.forEach(ring => {
      if (ring.length < 3) return;
      const node = el("polygon", { points: ring.map(p => `${mx(p[0]).toFixed(1)},${my(p[1]).toFixed(1)}`).join(" "),
        fill: v ? shade(t) : "var(--land)", stroke: "var(--line)", "stroke-width": v ? 1 : .5 }, g);
      if (v) el("title", {}, node, `${c.name}: ${num(v)} event-days`);
    });
  });

  // ---- breakdown: mechanism and scope on the left, trigger on the right
  const bX = PAD + mW + 40, bW = W - PAD - bX;
  const hasTrig = D.triggers && D.triggers.length > 0;
  const colW = hasTrig ? bW / 2 - 12 : bW;
  el("text", { x: bX, y: mY - 8, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "By mechanism");
  const causes = Object.entries(S.byCause).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxCause = Math.max(1, ...causes.map(c => c[1]));
  causes.forEach(([k, v], i) => {
    const y = mY + i * 22;
    el("rect", { x: bX, y, width: colW * (v / maxCause), height: 14, rx: 3, fill: COLOURS[k] || COLOURS.unknown, opacity: .6 }, svg);
    el("text", { x: bX + 6, y: y + 11, fill: "var(--ink)", "font-size": 11, "font-weight": 700 }, svg,
       `${causeLabel(k)} ${num(v)}`);
  });
  const sY = mY + 150;
  el("text", { x: bX, y: sY - 8, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "By scope");
  const scopes = Object.entries(S.byScope).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const maxScope = Math.max(1, ...scopes.map(s => s[1]));
  scopes.forEach(([k, v], i) => {
    const y = sY + i * 20;
    el("rect", { x: bX, y, width: colW * (v / maxScope), height: 13, rx: 3, fill: "var(--accent)", opacity: .6 }, svg);
    el("text", { x: bX + 6, y: y + 10, fill: "var(--ink)", "font-size": 10.5, "font-weight": 700 }, svg, `${k} ${num(v)}`);
  });
  if (hasTrig) {
    const tX = bX + colW + 24;
    el("text", { x: tX, y: mY - 8, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "By trigger");
    const trigs = Object.entries(S.byTrigger).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxTrig = Math.max(1, ...trigs.map(t => t[1]));
    trigs.forEach(([k, v], i) => {
      const y = mY + i * 22;
      el("rect", { x: tX, y, width: colW * (v / maxTrig), height: 14, rx: 3, fill: "var(--warm)", opacity: .55 }, svg);
      el("text", { x: tX + 6, y: y + 11, fill: "var(--ink)", "font-size": 10.5, "font-weight": 700 }, svg,
         `${k.length > 22 ? k.slice(0, 21) + "..." : k} ${num(v)}`);
    });
  }

  // ---- side
  const side = $("side"); side.replaceChildren();
  const h2 = document.createElement("h2"); h2.textContent = "Summary"; side.append(h2);
  const t = document.createElement("table");
  for (const [k, v] of [["Events", num(S.evs.length)], ["Event-days", num(S.days)],
                        ["Countries", Object.keys(S.byC).length], ["Causes", Object.keys(S.byCause).length]]) {
    const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = k;
    const b = document.createElement("td"); b.textContent = v; tr.append(a, b); t.append(tr);
  }
  side.append(t);
  const h3 = document.createElement("h2"); h3.textContent = "Top countries"; h3.style.marginTop = "14px"; side.append(h3);
  const t2 = document.createElement("table");
  Object.entries(S.byC).sort((a, b) => b[1] - a[1]).slice(0, 10).forEach(([name, v]) => {
    const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = name;
    const b = document.createElement("td"); b.textContent = num(v) + " d"; tr.append(a, b); t2.append(tr);
  });
  side.append(t2);
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "Aggregated reports only. A reported disruption is not a measured one; the source " +
    "decides what a row means. This graphic names no person and no individual subscriber. " +
    (D.lane_by === "region" ? "Bars are grouped by area, not country. " : "") +
    (D.unmapped && D.unmapped.length ? `${D.unmapped.length} country spelling(s) had no outline and are shown in the tables only.` : "");
  side.append(hint);

  $("chart").replaceChildren(svg);
  buildTable(S);
}

function shade(t) {
  const a = [29, 74, 74], b = [242, 166, 90];
  const m = a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t))));
  return "#" + m.map(v => v.toString(16).padStart(2, "0")).join("");
}

function buildTable(S) {
  const box = $("table"); box.replaceChildren();
  const mk = (title, head, rows) => {
    const h = document.createElement("h3"); h.textContent = title; box.append(h);
    const t = document.createElement("table"); t.className = "big";
    const hr = document.createElement("tr");
    head.forEach(x => { const th = document.createElement("th"); th.textContent = x; hr.append(th); }); t.append(hr);
    rows.forEach(r => { const tr = document.createElement("tr");
      r.forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.append(td); }); t.append(tr); });
    box.append(t);
  };
  mk("Events", ["Start", "End", "Days", "Country", "Area", "Scope", "Mechanism", "Trigger", "Open", "Source", "Note"],
     S.evs.slice().sort((a, b) => a.s.localeCompare(b.s)).map(e =>
       [e.s, e.e, e.days, e.c, e.region || "-", e.scope || "-", causeLabel(e.cause), e.trigger || "-",
        e.open === "ongoing" ? "ongoing" : e.open === "unknown" ? "end unknown" : "-", e.src || "-", e.note || "-"]));
  mk("Countries", ["Country", "Event-days", "Events"],
     Object.entries(S.byC).sort((a, b) => b[1] - a[1]).map(([n, v]) =>
       [n, v, S.evs.filter(e => e.c === n).length]));
  mk("Months", ["Month", "Event-days"], Object.entries(S.byM).sort().map(([m, v]) => [m, v]));
}

$("foot").textContent = `${D.source ? "Source: " + D.source + ". " : "Source not stated. "}` +
  `Generated ${D.generated} from ${D.input}. Country outlines: Natural Earth (public domain). Aggregate of ` +
  `reported disruption events; no person or individual subscriber is named. Made with osint-visuals.`;
render();
</script>
</body></html>
